<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KABUS SITE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #00ff88;
    font-family: 'Courier New', ui-monospace, monospace;
    overflow: hidden;
    height: 100vh;
  }

  /* ================== SPLASH SCREEN ================== */
  #splash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #001a0d 0%, #000 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.8s ease;
  }

  #splash.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* Matrix rain background */
  #matrix {
    position: absolute;
    inset: 0;
    opacity: 0.18;
    z-index: 0;
  }

  #splash .content {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 0 20px;
  }

  .welcome-line {
    font-size: clamp(18px, 4vw, 28px);
    letter-spacing: 6px;
    color: #00ff88;
    opacity: 0;
    text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88;
    animation: fadeIn 1s ease forwards;
  }

  .welcome-line.delay-1 { animation-delay: 0.2s; }
  .welcome-line.delay-2 { animation-delay: 0.7s; }

  .site-name {
    font-size: clamp(36px, 9vw, 82px);
    font-weight: 900;
    letter-spacing: 10px;
    margin: 24px 0 12px;
    color: #00ff88;
    opacity: 0;
    text-shadow:
      0 0 8px #00ff88,
      0 0 22px #00ff88,
      0 0 40px #00d46a;
    animation: glowIn 1.4s ease 1.2s forwards;
  }

  .tagline {
    font-size: clamp(12px, 2vw, 16px);
    letter-spacing: 4px;
    color: #00c46a;
    opacity: 0;
    animation: fadeIn 1s ease 2s forwards;
  }

  /* Progress bar */
  .progress-wrap {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: min(70%, 520px);
    z-index: 1;
  }

  .progress-label {
    font-size: 12px;
    letter-spacing: 3px;
    color: #00ff88;
    margin-bottom: 10px;
    text-align: center;
    opacity: 0.85;
  }

  .progress-bar {
    width: 100%;
    height: 4px;
    background: rgba(0, 255, 136, 0.12);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00ff88, #00d46a, #00ff88);
    box-shadow: 0 0 12px #00ff88;
    animation: fillBar 3s ease-out forwards;
  }

  .progress-percent {
    margin-top: 8px;
    font-size: 11px;
    color: #00c46a;
    text-align: right;
    opacity: 0.7;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes glowIn {
    0%   { opacity: 0; letter-spacing: 30px; filter: blur(8px); }
    60%  { opacity: 1; letter-spacing: 12px; filter: blur(0); }
    100% { opacity: 1; letter-spacing: 10px; }
  }

  @keyframes fillBar {
    0%   { width: 0%; }
    20%  { width: 18%; }
    45%  { width: 42%; }
    70%  { width: 68%; }
    90%  { width: 88%; }
    100% { width: 100%; }
  }

  /* ================== MAIN PAGE ================== */
  #main {
    display: none;
    min-height: 100vh;
    background: radial-gradient(circle at top, #001a0d 0%, #000 60%);
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
    animation: fadeIn 0.8s ease;
  }

  #main.show { display: flex; }

  .banner {
    width: 100%;
    max-width: 720px;
    background: linear-gradient(90deg, rgba(0, 255, 136, 0.08), rgba(0, 255, 136, 0.02));
    border: 1px solid #00ff88;
    border-radius: 10px;
    padding: 14px 20px;
    margin-bottom: 26px;
    text-align: center;
    font-size: clamp(13px, 2vw, 15px);
    letter-spacing: 1px;
    color: #00ff88;
    box-shadow: 0 0 18px rgba(0, 255, 136, 0.25);
  }

  .banner .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #00ff88;
    border-radius: 50%;
    margin-left: 8px;
    box-shadow: 0 0 8px #00ff88;
    animation: blink 1.4s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }

  .logo {
    font-size: clamp(34px, 8vw, 68px);
    font-weight: 900;
    letter-spacing: 8px;
    color: #00ff88;
    text-shadow: 0 0 12px #00ff88, 0 0 30px #00d46a;
    margin: 20px 0 8px;
    text-align: center;
  }

  .subtitle {
    font-size: clamp(12px, 2vw, 15px);
    letter-spacing: 3px;
    color: #00c46a;
    margin-bottom: 40px;
    text-align: center;
  }

  .enter-btn {
    display: inline-block;
    padding: 18px 60px;
    font-size: clamp(15px, 2.4vw, 18px);
    font-weight: 900;
    letter-spacing: 4px;
    color: #000;
    background: linear-gradient(90deg, #00ff88, #00d46a);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    text-transform: uppercase;
    box-shadow: 0 0 24px rgba(0, 255, 136, 0.55), 0 0 60px rgba(0, 255, 136, 0.2);
    transition: transform 0.15s ease, box-shadow 0.25s ease;
    animation: pulse 2s infinite;
  }

  .enter-btn:hover {
    transform: scale(1.04);
    box-shadow: 0 0 32px rgba(0, 255, 136, 0.85), 0 0 80px rgba(0, 255, 136, 0.35);
  }

  .enter-btn:active {
    transform: scale(0.98);
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 24px rgba(0, 255, 136, 0.55), 0 0 60px rgba(0, 255, 136, 0.2); }
    50%      { box-shadow: 0 0 34px rgba(0, 255, 136, 0.9), 0 0 80px rgba(0, 255, 136, 0.4); }
  }

  .note {
    margin-top: 26px;
    font-size: 12px;
    letter-spacing: 2px;
    color: #008844;
    text-align: center;
  }

  .footer-tag {
    position: fixed;
    bottom: 14px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    color: #006633;
    letter-spacing: 3px;
  }
</style>
</head>
<body>

  <!-- ================= SPLASH ================= -->
  <div id="splash">
    <canvas id="matrix"></canvas>

    <div class="content">
      <div class="welcome-line">WELCOME TO</div>
      <div class="welcome-line delay-2">KABUS SİTE</div>
      <div class="site-name">KABUS</div>
      <div class="tagline">SECURE · FAST · ENCRYPTED</div>
    </div>

    <div class="progress-wrap">
      <div class="progress-label">LOADING SYSTEM</div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <div class="progress-percent" id="pct">0%</div>
    </div>
  </div>

  <!-- ================= MAIN ================= -->
  <div id="main">
    <div class="banner">
      THIS SITE SUPPORTS NON-VBV CARDS <span class="dot"></span>
    </div>

    <div class="logo">KABUS SİTE</div>
    <div class="subtitle">SECURE PAYMENT PORTAL</div>

    <a class="enter-btn" href="https://buymeacoffee.com/kabusbaba" target="_blank" rel="noopener">
      ENTER PAYMENT
    </a>

    <div class="note">PROTECTED BY ENCRYPTED GATEWAY</div>
  </div>

  <div class="footer-tag">KABUS SİTE © 2026</div>

<script>
  /* ================= Matrix rain ================= */
  (function matrixRain() {
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@".split("");
    const fontSize = 14;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = new Array(columns).fill(1);

    function draw() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#00ff88";
      ctx.font = fontSize + "px 'Courier New', monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(draw, 55);
  })();

  /* ================= Percent counter ================= */
  (function percentCounter() {
    const el = document.getElementById("pct");
    let value = 0;
    const duration = 3000;
    const stepTime = duration / 100;
    const timer = setInterval(() => {
      value++;
      if (value >= 100) {
        value = 100;
        clearInterval(timer);
      }
      el.textContent = value + "%";
    }, stepTime);
  })();

  /* ================= Switch to main ================= */
  setTimeout(() => {
    const splash = document.getElementById("splash");
    const main   = document.getElementById("main");

    splash.classList.add("hidden");
    main.classList.add("show");

    setTimeout(() => { splash.style.display = "none"; }, 800);
  }, 3400);
</script>
</body>
</html>
